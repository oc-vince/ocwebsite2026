<!-- ============ IMAGE LIGHTBOX ============ -->
<div class="plx" id="plx" role="dialog" aria-modal="true" aria-label="Photograph viewer" hidden>
  <div class="plx__scrim" data-plx-close></div>
  <button class="plx__btn plx__close" type="button" data-plx-close aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="plx__btn plx__prev" type="button" id="plxPrev" aria-label="Previous photograph">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="plx__btn plx__next" type="button" id="plxNext" aria-label="Next photograph">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="plx__stage">
    <img class="plx__shot" id="plxShot" alt="">
    <p class="plx__count" id="plxCount"></p>
  </div>
</div>
