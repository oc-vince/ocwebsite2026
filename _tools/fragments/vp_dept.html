        </label>
        <label class="choice">
          <input type="checkbox" name="vp_purpose[]" value="Product Promotion">
          <span class="box" aria-hidden="true"></span>

        </label>
        <label class="choice">
          <input type="checkbox" name="vp_purpose[]" value="Corporate / Business">
          <span class="box" aria-hidden="true"></span>

        </label>
        <label class="choice">
          <input type="checkbox" name="vp_purpose[]" value="Training / Educational">
          <span class="box" aria-hidden="true"></span>

        </label>
        <label class="choice">

          <span class="box" aria-hidden="true"></span>
